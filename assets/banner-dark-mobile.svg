<svg width="640" height="430" viewBox="0 0 640 430" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Qiang 的个人主页横幅">
  <defs>
    <clipPath id="card">
      <rect width="640" height="430" rx="16"/>
    </clipPath>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0 H0 V25" fill="none" stroke="#E6EDF3" stroke-opacity="0.035"/>
    </pattern>
    <radialGradient id="glowTeal" cx="0.85" cy="0.06" r="0.6">
      <stop offset="0" stop-color="#7CE7D9" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7CE7D9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGold" cx="0.06" cy="0.96" r="0.5">
      <stop offset="0" stop-color="#E8C87A" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#E8C87A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#card)">
    <rect width="640" height="430" fill="#0F141C"/>
    <rect width="640" height="430" fill="url(#grid)"/>
    <rect width="640" height="430" fill="url(#glowTeal)"/>
    <rect width="640" height="430" fill="url(#glowGold)"/>

    <g stroke="#7CE7D9" stroke-opacity="0.7" stroke-width="2" fill="none">
      <path d="M14 36 V14 H36"/>
      <path d="M626 36 V14 H604"/>
      <path d="M14 394 V416 H36"/>
      <path d="M626 394 V416 H604"/>
    </g>

    <line x1="38" y1="112" x2="38" y2="286" stroke="#7CE7D9" stroke-opacity="0.45" stroke-width="2"/>
    <rect x="34" y="108" width="8" height="8" fill="#E8C87A">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
    </rect>

    <text x="66" y="112" font-family="'SF Mono','Cascadia Code',Consolas,monospace" font-size="22" letter-spacing="2" fill="#E8C87A">~/qiang<tspan fill="#7CE7D9">▍</tspan></text>

    <text x="48" y="222" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="118" font-weight="800" fill="#E6EDF3">Qiang<tspan fill="#E8C87A">.</tspan></text>
    <text x="50" y="272" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="34" font-weight="600" fill="#A9B4C0">专注开源项目与工具自动化</text>
    <text x="50" y="306" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" fill="#7A8694">Web 开发 · 自动化 · 云计算 · 网络安全</text>

    <g font-family="'SF Mono','Cascadia Code',Consolas,monospace" font-size="20">
      <rect x="50" y="330" width="72" height="36" rx="10" fill="#151C27" stroke="#7CE7D9" stroke-opacity="0.5"/>
      <text x="86" y="354" text-anchor="middle" fill="#7CE7D9">Web</text>
      <rect x="134" y="330" width="94" height="36" rx="10" fill="#151C27" stroke="#7CE7D9" stroke-opacity="0.5"/>
      <text x="181" y="354" text-anchor="middle" fill="#7CE7D9">自动化</text>
      <rect x="240" y="330" width="94" height="36" rx="10" fill="#151C27" stroke="#7CE7D9" stroke-opacity="0.5"/>
      <text x="287" y="354" text-anchor="middle" fill="#7CE7D9">云计算</text>
      <rect x="346" y="330" width="108" height="36" rx="10" fill="#151C27" stroke="#7CE7D9" stroke-opacity="0.5"/>
      <text x="400" y="354" text-anchor="middle" fill="#7CE7D9">网络安全</text>
    </g>

    <g>
      <rect x="462" y="62" width="130" height="76" rx="10" fill="#131A24" stroke="#2A3542"/>
      <circle cx="480" cy="79" r="3.5" fill="#E8C87A"/>
      <circle cx="494" cy="79" r="3.5" fill="#7CE7D9"/>
      <circle cx="508" cy="79" r="3.5" fill="#475569"/>
      <line x1="462" y1="90" x2="592" y2="90" stroke="#232E3B"/>
      <text x="474" y="110" font-family="'SF Mono','Cascadia Code',Consolas,monospace" font-size="13"><tspan fill="#E8C87A">$ </tspan><tspan fill="#C9D1D9">whoami</tspan></text>
      <text x="474" y="128" font-family="'SF Mono','Cascadia Code',Consolas,monospace" font-size="13" fill="#7CE7D9">Qiang</text>
    </g>

    <text x="50" y="402" font-family="'SF Mono','Cascadia Code',Consolas,monospace" font-size="14" fill="#8B98A8">// qiang.txt</text>
    <text x="590" y="402" text-anchor="end" font-family="'SF Mono','Cascadia Code',Consolas,monospace" font-size="14" fill="#8B98A8">github.com/ZYQiang</text>
  </g>

  <rect x="0.5" y="0.5" width="639" height="429" rx="16" fill="none" stroke="#26303C"/>
