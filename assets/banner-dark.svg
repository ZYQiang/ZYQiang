<svg width="1000" height="300" viewBox="0 0 1000 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Qiang 的个人主页横幅">
  <defs>
    <clipPath id="card">
      <rect width="1000" height="300" rx="14"/>
    </clipPath>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0 H0 V25" fill="none" stroke="#E6EDF3" stroke-opacity="0.035"/>
    </pattern>
    <radialGradient id="glowTeal" cx="0.85" cy="0.08" r="0.55">
      <stop offset="0" stop-color="#7CE7D9" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#7CE7D9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGold" cx="0.08" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#E8C87A" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#E8C87A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="300" fill="#0F141C"/>
    <rect width="1000" height="300" fill="url(#grid)"/>
    <rect width="1000" height="300" fill="url(#glowTeal)"/>
    <rect width="1000" height="300" fill="url(#glowGold)"/>

    <!-- corner registration marks -->
    <g stroke="#7CE7D9" stroke-opacity="0.7" stroke-width="2" fill="none">
      <path d="M16 38 V16 H38"/>
      <path d="M984 38 V16 H962"/>
      <path d="M16 262 V284 H38"/>
      <path d="M984 262 V284 H962"/>
    </g>

    <!-- signal rail -->
    <line x1="40" y1="74" x2="40" y2="244" stroke="#7CE7D9" stroke-opacity="0.45" stroke-width="2"/>
    <rect x="36" y="70" width="8" height="8" fill="#E8C87A"/>

    <!-- identity -->
    <text x="72" y="78" font-family="'SF Mono','Cascadia Code',Consolas,monospace" font-size="15" letter-spacing="2" fill="#E8C87A">~/qiang<tspan fill="#7CE7D9">▍</tspan></text>

    <text x="56" y="158" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="92" font-weight="800" fill="#E6EDF3">Qiang<tspan fill="#E8C87A">.</tspan></text>
    <text x="58" y="200" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#A9B4C0">专注开源项目与工具自动化</text>
    <text x="58" y="228" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#7A8694">Web 开发 · 自动化 · 云计算 · 网络安全</text>

    <!-- focus chips -->
    <g font-family="'SF Mono','Cascadia Code',Consolas,monospace" font-size="13">
      <rect x="56" y="252" width="52" height="28" rx="8" fill="#151C27" stroke="#7CE7D9" stroke-opacity="0.5"/>
      <text x="82" y="270" text-anchor="middle" fill="#7CE7D9">Web</text>
      <rect x="120" y="252" width="67" height="28" rx="8" fill="#151C27" stroke="#7CE7D9" stroke-opacity="0.5"/>
      <text x="153" y="270" text-anchor="middle" fill="#7CE7D9">自动化</text>
      <rect x="199" y="252" width="67" height="28" rx="8" fill="#151C27" stroke="#7CE7D9" stroke-opacity="0.5"/>
      <text x="232" y="270" text-anchor="middle" fill="#7CE7D9">云计算</text>
      <rect x="278" y="252" width="67" height="28" rx="8" fill="#151C27" stroke="#7CE7D9" stroke-opacity="0.5"/>
      <text x="311" y="270" text-anchor="middle" fill="#7CE7D9">网络安全</text>
    </g>

    <!-- terminal panel -->
    <rect x="552" y="36" width="400" height="212" rx="12" fill="#131A24" stroke="#2A3542"/>
    <path d="M564 36 H940 A12 12 0 0 1 952 48 V72 H552 V48 A12 12 0 0 1 564 36 Z" fill="#16202B"/>
    <line x1="552" y1="76" x2="952" y2="76" stroke="#232E3B"/>
    <circle cx="574" cy="56" r="4" fill="#E8C87A"/>
    <circle cx="590" cy="56" r="4" fill="#7CE7D9"/>
    <circle cx="606" cy="56" r="4" fill="#475569"/>
    <text x="752" y="61" text-anchor="middle" font-family="'SF Mono','Cascadia Code',Consolas,monospace" font-size="13" fill="#7A8694">~/profile</text>

    <g font-family="'SF Mono','Cascadia Code',Consolas,monospace" font-size="15">
      <text x="574" y="104"><tspan fill="#E8C87A">$ </tspan><tspan fill="#C9D1D9">whoami</tspan></text>
      <text x="574" y="132" fill="#7CE7D9">Qiang — full-stack · automation</text>
      <text x="574" y="160"><tspan fill="#E8C87A">$ </tspan><tspan fill="#C9D1D9">cat focus.txt</tspan></text>
      <text x="574" y="188" fill="#7CE7D9">web · cloud · security</text>
      <text x="574" y="216" fill="#E8C87A">→ PRs welcome @ ZYQiang</text>
    </g>

    <text x="56" y="292" font-family="'SF Mono','Cascadia Code',Consolas,monospace" font-size="12" fill="#5B6675">// qiang.txt · 持续更新中</text>
    <text x="944" y="292" text-anchor="end" font-family="'SF Mono','Cascadia Code',Consolas,monospace" font-size="12" fill="#5B6675">github.com/ZYQiang</text>
  </g>

  <rect x="0.5" y="0.5" width="999" height="299" rx="14" fill="none" stroke="#26303C"/>
</svg>
