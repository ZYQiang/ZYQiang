<svg width="1000" height="300" viewBox="0 0 1000 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Qiang 的个人主页横幅">
  <defs>
    <clipPath id="card">
      <rect width="1000" height="300" rx="14"/>
    </clipPath>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0 H0 V25" fill="none" stroke="#0B0F17" stroke-opacity="0.045"/>
    </pattern>
    <radialGradient id="glowTeal" cx="0.85" cy="0.08" r="0.55">
      <stop offset="0" stop-color="#0E7C72" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#0E7C72" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGold" cx="0.08" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#A16207" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#A16207" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="300" fill="#F7F9FB"/>
    <rect width="1000" height="300" fill="url(#grid)"/>
    <rect width="1000" height="300" fill="url(#glowTeal)"/>
    <rect width="1000" height="300" fill="url(#glowGold)"/>

    <!-- corner registration marks -->
    <g stroke="#0E7C72" stroke-opacity="0.65" stroke-width="2" fill="none">
      <path d="M16 38 V16 H38"/>
      <path d="M984 38 V16 H962"/>
      <path d="M16 262 V284 H38"/>
      <path d="M984 262 V284 H962"/>
    </g>

    <!-- signal rail -->
    <line x1="40" y1="74" x2="40" y2="244" stroke="#0E7C72" stroke-opacity="0.4" stroke-width="2"/>
    <rect x="36" y="70" width="8" height="8" fill="#B45309">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
    </rect>

    <!-- identity -->
    <text x="72" y="78" font-family="'SF Mono','Cascadia Code',Consolas,monospace" font-size="15" letter-spacing="2" fill="#A16207">~/qiang<tspan fill="#0E7C72">▍</tspan></text>

    <text x="56" y="158" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="92" font-weight="800" fill="#0B0F17">Qiang<tspan fill="#B45309">.</tspan></text>
    <text x="58" y="200" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#334155">专注开源项目与工具自动化</text>
    <text x="58" y="228" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#64748B">Web 开发 · 自动化 · 云计算 · 网络安全</text>

    <!-- focus chips -->
    <g font-family="'SF Mono','Cascadia Code',Consolas,monospace" font-size="13">
      <rect x="56" y="252" width="52" height="28" rx="8" fill="#FFFFFF" stroke="#0E7C72" stroke-opacity="0.45"/>
      <text x="82" y="270" text-anchor="middle" fill="#0E7C72">Web</text>
      <rect x="120" y="252" width="67" height="28" rx="8" fill="#FFFFFF" stroke="#0E7C72" stroke-opacity="0.45"/>
      <text x="153" y="270" text-anchor="middle" fill="#0E7C72">自动化</text>
      <rect x="199" y="252" width="67" height="28" rx="8" fill="#FFFFFF" stroke="#0E7C72" stroke-opacity="0.45"/>
      <text x="232" y="270" text-anchor="middle" fill="#0E7C72">云计算</text>
      <rect x="278" y="252" width="67" height="28" rx="8" fill="#FFFFFF" stroke="#0E7C72" stroke-opacity="0.45"/>
      <text x="311" y="270" text-anchor="middle" fill="#0E7C72">网络安全</text>
    </g>

    <!-- terminal panel -->
    <rect x="552" y="36" width="400" height="212" rx="12" fill="#FFFFFF" stroke="#DCE3E8"/>
    <path d="M564 36 H940 A12 12 0 0 1 952 48 V72 H552 V48 A12 12 0 0 1 564 36 Z" fill="#F2F5F8"/>
    <line x1="552" y1="76" x2="952" y2="76" stroke="#E1E7EC"/>
    <circle cx="574" cy="56" r="4" fill="#D97706"/>
    <circle cx="590" cy="56" r="4" fill="#0E7C72"/>
    <circle cx="606" cy="56" r="4" fill="#94A3B8"/>
    <text x="752" y="61" text-anchor="middle" font-family="'SF Mono','Cascadia Code',Consolas,monospace" font-size="13" fill="#64748B">~/profile</text>

    <g font-family="'SF Mono','Cascadia Code',Consolas,monospace" font-size="16">
      <text x="574" y="104"><tspan fill="#B45309">$ </tspan><tspan fill="#24292F">whoami</tspan></text>
      <text x="574" y="132" fill="#0E7C72">Qiang — full-stack · automation</text>
      <text x="574" y="160"><tspan fill="#B45309">$ </tspan><tspan fill="#24292F">cat focus.txt</tspan></text>
      <text x="574" y="188" fill="#0E7C72">web · cloud · security</text>
      <text x="574" y="216" fill="#B45309">→ PRs welcome @ ZYQiang</text>
    </g>

    <text x="56" y="292" font-family="'SF Mono','Cascadia Code',Consolas,monospace" font-size="14" fill="#6B7683">// qiang.txt · 持续更新中</text>
    <text x="944" y="292" text-anchor="end" font-family="'SF Mono','Cascadia Code',Consolas,monospace" font-size="14" fill="#6B7683">github.com/ZYQiang</text>
  </g>

  <rect x="0.5" y="0.5" width="999" height="299" rx="14" fill="none" stroke="#DCE3E8"/>
</svg>
